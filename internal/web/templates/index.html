<!DOCTYPE html>
<html lang="en">
<head>
    <title>HydraMancer - Creator Onboarding</title>
    {{template "head"}}
    <style>
        .hero {
            text-align: center;
            padding: 80px 24px;
        }
        .hero h2 {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
        }
        .hero h2 span { color: #6366f1; }
        .hero p {
            font-size: 18px;
            color: #888;
            max-width: 600px;
            margin: 0 auto 32px;
            line-height: 1.6;
        }
        .hero .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            background: #1e1e2e;
            border: 1px solid #333;
            color: #818cf8;
        }
    </style>
</head>
<body>
    {{template "header"}}
    <div class="container">
        <div class="hero">
            <div class="badge">Creator Portal</div>
            <h2>Build for <span>Experiencenet</span></h2>
            <p>HydraMancer helps game engine developers set up and deploy interactive experiences to Experiencenet as quickly as possible.</p>
            <p style="color: #555; font-size: 14px;">Coming soon — this portal is under construction.</p>
        </div>
    </div>
</body>
</html>
