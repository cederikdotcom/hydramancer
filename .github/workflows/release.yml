name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'

      - name: Build all platforms
        run: |
          VERSION="${{ github.ref_name }}"
          LDFLAGS="-X github.com/cederikdotcom/hydramancer/internal/cli.Version=${VERSION}"

          GOOS=linux  GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o hydramancer-linux-amd64   ./cmd/hydramancer
          GOOS=linux  GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o hydramancer-linux-arm64   ./cmd/hydramancer
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o hydramancer-darwin-amd64  ./cmd/hydramancer
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o hydramancer-darwin-arm64  ./cmd/hydramancer
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o hydramancer-windows-amd64.exe ./cmd/hydramancer

      - name: Publish to release server
        env:
          HYDRARELEASE_PUBLISH_TOKEN: ${{ secrets.HYDRARELEASE_PUBLISH_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          SERVER="https://releases.experiencenet.com"
          PROJECT="hydramancer"
          CHANNEL="production"

          for BINARY in hydramancer-linux-amd64 hydramancer-linux-arm64; do
            echo "Publishing ${BINARY}..."
            curl -f -X POST \
              -H "Authorization: Bearer ${HYDRARELEASE_PUBLISH_TOKEN}" \
              --data-binary @"${BINARY}" \
              "${SERVER}/api/v1/publish/${PROJECT}/${CHANNEL}/${VERSION}/${BINARY}"
          done

          echo "Finalizing release..."
          curl -f -X POST \
            -H "Authorization: Bearer ${HYDRARELEASE_PUBLISH_TOKEN}" \
            "${SERVER}/api/v1/publish/${PROJECT}/${CHANNEL}/${VERSION}/finalize"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: hydramancer-*
          generate_release_notes: true

  image:
    name: Publish OCI image
    runs-on: ubuntu-latest
    # Independent of the binary job: host installs still update through
    # releases.experiencenet.com, so this is additive rather than a replacement.
    steps:
    - uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the scale registry
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.SCALE_REGISTRY }}
        username: ${{ vars.SCALE_REGISTRY_USER }}
        password: ${{ secrets.SCALE_REGISTRY_TOKEN }}

    - name: Build and push (amd64 + arm64)
      uses: docker/build-push-action@v6
      with:
        context: .
        # arm64 from day one: the Pi fleet is arm64, and a single-arch image
        # cannot be scheduled there at all.
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          VERSION=${{ steps.get_version.outputs.version }}
        tags: |
          ${{ vars.SCALE_REGISTRY }}/hydramancer:${{ steps.get_version.outputs.version }}
          ${{ vars.SCALE_REGISTRY }}/hydramancer:latest

    - name: Verify both architectures are present
      run: |
        REG=${{ vars.SCALE_REGISTRY }}
        docker buildx imagetools inspect "$REG/hydramancer:${{ steps.get_version.outputs.version }}" \
          | tee /tmp/manifest.txt
        for arch in amd64 arm64; do
          grep -q "linux/$arch" /tmp/manifest.txt || { echo "missing linux/$arch"; exit 1; }
        done
